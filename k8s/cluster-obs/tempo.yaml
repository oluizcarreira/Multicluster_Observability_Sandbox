apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks
        wal:
          path: /tmp/tempo/wal
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  type: NodePort
  selector:
    app: tempo
  ports:
    - name: otlp-grpc
      port: 4317
    - name: http
      port: 3200
      nodePort: 30200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
      - name: tempo
        image: grafana/tempo:latest
        args: 
          - "-config.file=/etc/tempo.yaml"
        ports:
        - containerPort: 4317
        - containerPort: 3200
        volumeMounts:
        - name: tempo-config-vol
          mountPath: /etc/tempo.yaml
          subPath: tempo.yaml
      volumes:
      - name: tempo-config-vol
        configMap:
          name: tempo-config